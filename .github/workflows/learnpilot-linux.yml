name: LearnPilot Linux package
run-name: LearnPilot Linux package #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: Build Linux x64 package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vendored runtime entries
        run: |
          pnpm exec tsdown vendor/cosmokit/src/index.ts --no-config --out-dir vendor/cosmokit/lib --format esm --no-dts --sourcemap --no-clean
          cp vendor/cosmokit/lib/index.mjs vendor/cosmokit/lib/index.js
          pnpm exec tsdown vendor/cordis/src/index.ts --no-config --out-dir vendor/cordis/lib --format esm --no-dts --sourcemap --no-clean
          cp vendor/cordis/lib/index.mjs vendor/cordis/lib/index.js

      - name: Build workspace
        run: pnpm run build:official

      - name: Rebuild Linux node-pty against manylinux 2.28
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) image=quay.io/pypa/manylinux_2_28_x86_64 ;;
            ARM64) image=quay.io/pypa/manylinux_2_28_aarch64 ;;
            *) echo "::error::Unsupported Linux runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          addon_dir="$(realpath packages/subprocess/subprocess-local/node_modules/node-pty)"
          pnpm_setup_root="$(realpath "$(dirname "$(dirname "$PNPM_HOME")")")"
          (cd "$addon_dir" && npm_config_build_from_source=true pnpm run install)
          addon="$addon_dir/build/Release/pty.node"
          [ -f "$addon_dir/build/Makefile" ] || {
            echo "::error::node-pty install did not generate $addon_dir/build/Makefile"
            exit 1
          }
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/node-gyp:$HOME/.cache/node-gyp:ro" \
            -v "$pnpm_setup_root:$pnpm_setup_root:ro" \
            -w "$addon_dir" \
            "$image" \
            bash -euxo pipefail -c \
              'rm -rf build/Release && make -C build -j2 BUILDTYPE=Release'
          [ -f "$addon" ] || { echo "::error::$addon missing after manylinux rebuild"; exit 1; }
          readelf --version-info "$addon" | tee node-pty-glibc-versions.txt
          maximum="$(sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' node-pty-glibc-versions.txt | sort -V | tail -1)"
          [ -n "$maximum" ] || { echo "::error::No GLIBC requirements found in $addon"; exit 1; }
          dpkg --compare-versions "$maximum" le 2.28 || {
            echo "::error::node-pty addon requires GLIBC_$maximum but package claims manylinux_2_28"
            exit 1
          }

      - name: Build Linux executable
        run: pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets=node24-linux-x64 --skip-build

      - name: Build installer archives
        run: bash packaging/linux/build-package.sh "0.1.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: learnpilot-linux-x64
          path: |
            dist-linux/learnpilot-linux-x64.deb
            dist-linux/learnpilot-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
